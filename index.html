<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<style>
html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #000;
    touch-action: none; -webkit-user-select: none; user-select: none;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
}
canvas { display: block; }
#whiteout { position: fixed; inset: 0; background: #fff; z-index: 500; pointer-events: none; opacity: 0; }
#redflash {
    position: fixed; inset: 0;

}
#main-menu {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    z-index: 100;
    background: radial-gradient(circle at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.85) 100%);
    transition: opacity 0.8s ease, visibility 0.8s;
}
#main-menu.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.title-container { text-align: center; margin-bottom: 60px; animation: title-breathe 5s infinite alternate ease-in-out; }
@keyframes title-breathe {
    0% { transform: scale(1); opacity: 0.9; }
    100% { transform: scale(1.02); opacity: 1; filter: blur(0.5px); }
}
.title-main { font-size: 58px; font-weight: 900; color: #e0e0e0; letter-spacing: 14px; margin-right: -14px; text-shadow: 0 0 20px rgba(255,255,255,0.1); }
.title-sub { font-size: 13px; color: #666; letter-spacing: 8px; margin-top: 12px; font-weight: 300; text-transform: uppercase; }
.menu-buttons { display: flex; flex-direction: column; gap: 16px; width: 280px; }
.menu-btn {
    background: rgba(15, 15, 15, 0.65);
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.7);
    padding: 18px 0;
    font-size: 18px; letter-spacing: 5px;
    cursor: pointer; outline: none;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    position: relative; overflow: hidden; font-family: inherit;
}
.menu-btn:hover:not(:disabled), .menu-btn:active:not(:disabled) {
    background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.6);
    box-shadow: 0 0 20px rgba(255,255,255,0.1); letter-spacing: 7px;
}
.menu-btn:disabled { opacity: 0.25; cursor: not-allowed; border-color: rgba(255,255,255,0.05); text-shadow: none; }
#game-ui { display: none; }
#ui {
    position: fixed; left: 0; right: 0; bottom: 0; height: 150px;
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 0 24px 24px; box-sizing: border-box; pointer-events: none; z-index: 10;
}
.btn {
    width: 100px; height: 100px; border-radius: 50%;
    background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.25);
    color: rgba(255,255,255,0.55); font-size: 34px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto; -webkit-tap-highlight-color: transparent; user-select: none;
}
.btn.pressed { background: rgba(255,255,255,0.35); color: #fff; }
#btn-look {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
    width: 84px; height: 84px; border-radius: 50%;
    background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.25);
    color: rgba(255,255,255,0.55); font-size: 16px; font-weight: bold;
    display: none; align-items: center; justify-content: center;
    z-index: 10; cursor: pointer; -webkit-tap-highlight-color: transparent;
    user-select: none; touch-action: none; transition: all 0.15s;
}
#btn-look.active { background: rgba(255,255,255,0.35); color: #fff; }
#btn-look.cooldown { background: rgba(255,255,255,0.02); border-color: rgba(255,255,255,0.10); color: rgba(255,255,255,0.28); }
#btn-look.deny { border-color: rgba(255,90,90,0.85); color: rgba(255,90,90,0.95); }
#btn-fire {
    position: fixed; bottom: 150px; right: 24px;
    width: 80px; height: 80px; border-radius: 50%;
    background: rgba(255,0,0,0.10); border: 2px solid rgba(255,50,50,0.45);
    color: rgba(255,100,100,0.85); font-size: 16px; font-weight: bold;
    display: none; align-items: center; justify-content: center;
    z-index: 10; cursor: pointer; -webkit-tap-highlight-color: transparent;
    user-select: none; touch-action: none;
}
#btn-fire:active { background: rgba(255,0,0,0.35); transform: scale(0.92); }
#btn-pause {
    position: fixed; top: 20px; right: 20px; width: 42px; height: 42px;
    z-index: 50; background: rgba(0,0,0,0.5); border: 1px solid #555; color: #fff;
    font-size: 18px; display: none; justify-content: center; align-items: center;
    cursor: pointer; border-radius: 8px; -webkit-tap-highlight-color: transparent;
}
#crosshair {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 20px; height: 20px; z-index: 5; display: none; pointer-events: none;
}
#crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.45); }
#crosshair::before { width: 2px; height: 20px; left: 9px; }
#crosshair::after { height: 2px; width: 20px; top: 9px; }
#stamina-container {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    width: 180px; height: 4px; background: rgba(255, 255, 255, 0.1);
    border-radius: 2px; z-index: 20; pointer-events: none; overflow: hidden;
}
#stamina-fill { height: 100%; width: 100%; background: #ffffff; border-radius: 2px; transition: background-color 0.15s; }
#threat-ui-container {
    position: fixed; left: 12px; top: 42%; transform: translateY(-50%);
    width: 14px; height: 180px; background: #110000;
    border: 2px solid #441111;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.9), 0 0 5px rgba(255,0,0,0.1);
    padding: 3px; box-sizing: border-box; z-index: 20;
    opacity: 0; transition: opacity 0.5s; pointer-events: none;
}
#threat-bar-bg {
    width: 100%; height: 100%; background: #1a0505;
    position: relative; overflow: hidden; border: 1px solid #2a0808;
}
#threat-bar-fill {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 0%;
    background: #8b0000; transition: height 0.1s linear, background-color 0.3s;
    box-shadow: inset 0 0 8px rgba(255,0,0,0.4);
}
#threat-grid-overlay {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom, transparent, transparent 5px, rgba(0,0,0,0.7) 5px, rgba(0,0,0,0.7) 7px);
    pointer-events: none;
}
.threat-label {
    position: fixed; left: 32px; top: 42%; transform: translateY(-50%) rotate(180deg);
    writing-mode: vertical-rl; color: #8b0000; font-size: 10px;
    letter-spacing: 3px; font-weight: bold; text-shadow: 0 0 5px rgba(255,0,0,0.5);
    z-index: 20; opacity: 0; transition: opacity 0.5s; pointer-events: none;
}
.danger #threat-bar-fill { background: #ff1111; animation: pulse-alert 0.3s infinite alternate; }
.danger { border-color: #ff1111 !important; box-shadow: 0 0 15px rgba(255,0,0,0.6) !important; }
@keyframes pulse-alert {
    0% { opacity: 0.8; box-shadow: inset 0 0 10px rgba(255,255,255,0.5); }
    100% { opacity: 1; box-shadow: inset 0 0 20px rgba(255,0,0,0.8); }
}
#inventory-container {
    position: fixed; right: 12px; top: 42%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 8px; z-index: 20;
    opacity: 0; transition: opacity 0.5s; pointer-events: none;
}
.inv-slot {
    width: 46px; height: 46px;
    background: #0a0a0a; border: 2px solid #333;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.9), 0 0 5px rgba(0,0,0,0.5);
    position: relative; cursor: pointer;
    display: flex; justify-content: center; align-items: center;
    transition: all 0.2s ease; box-sizing: border-box; pointer-events: auto;
}
.inv-slot::before, .inv-slot::after { content: ''; position: absolute; background: rgba(255,255,255,0.05); }
.inv-slot::before { width: 14px; height: 1px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
.inv-slot::after { width: 1px; height: 14px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
.slot-num { position: absolute; top: 1px; left: 3px; font-size: 10px; color: #555; font-weight: bold; z-index: 3; }
.inv-slot:hover { border-color: #666; background: #111; }
.inv-slot.active { border-color: #ddd; background: #1a1a1a; box-shadow: inset 0 0 15px rgba(0,0,0,0.9), 0 0 10px rgba(255,255,255,0.2); }
.inv-slot.active .slot-num { color: #ddd; }
.inv-slot.active-buff { border-color: #8b3fd6; box-shadow: 0 0 15px rgba(139,63,214,0.6); }
.inv-icon { width: 24px; height: 24px; z-index: 2; }
.icon-bullet { background: radial-gradient(circle, #a8862c 30%, #755a15 70%); border-radius: 4px; }
.icon-potion { background: linear-gradient(to top, #8b3fd6 60%, #222 60%); border-radius: 6px; border-top: 2px solid #555; box-sizing: border-box; }
.inv-count { position: absolute; bottom: 0px; right: 3px; font-size: 13px; color: #fff; font-weight: bold; text-shadow: 1px 1px 2px #000; z-index: 3; }
.game-playing #threat-ui-container,
.game-playing .threat-label,
.game-playing #inventory-container { opacity: 1; pointer-events: auto; }
#dialog {
    position: fixed; left: 0; right: 0; bottom: 0; height: 25vh; min-height: 150px;
    background: rgba(0,0,0,0.55); border-top: 1px solid rgba(0,255,102,0.55);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    z-index: 150; padding: 14px 22px 18px; box-sizing: border-box;
    display: none; font-family: "Courier New", "Consolas", "Menlo", monospace;
    color: #00ff66; text-shadow: 0 0 8px rgba(0,255,102,0.45);
}
#dialog.show { display: block; }
.dlg-name { font-size: 12px; letter-spacing: 3px; color: #00ff88; opacity: 0.8; margin-bottom: 6px; }
.dlg-en { font-size: 17px; line-height: 1.5; min-height: 26px; color: #00ff66; word-break: break-word; }
.dlg-en::before { content: "> "; color: #00aa44; }
.dlg-cn { font-size: 13px; color: #3a8f5a; margin-top: 6px; min-height: 18px; opacity: 0; transition: opacity 0.4s ease; }
.dlg-cn.show { opacity: 1; }
.dlg-hint { position: absolute; right: 20px; bottom: 12px; font-size: 11px; color: #00ff66; opacity: 0; letter-spacing: 1px; }
.dlg-hint.show { opacity: 1; animation: hintPulse 1.5s infinite; }
@keyframes hintPulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
.cursor { display: inline-block; width: 8px; height: 1em; background: #00ff66; vertical-align: text-bottom; margin-left: 2px; animation: blink 0.8s infinite; }
@keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
.free-hint {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    color: rgba(200,200,200,0.65); font-family: monospace; font-size: 12px;
    letter-spacing: 3px; z-index: 200; display: none; white-space: nowrap;
}
.free-hint.show { display: block; }
#pause-menu {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: none; flex-direction: column; justify-content: center; align-items: center;
    z-index: 300;
}
#pause-menu.show { display: flex; }
.pause-title { color: #fff; font-size: 32px; letter-spacing: 8px; margin-bottom: 40px; }
#toggle-debug {
    position: fixed; top: 12px; left: 12px; z-index: 400;
    background: rgba(0,0,0,0.72); border: 1px solid #3a3a3a; color: #0f0;
    padding: 8px 12px; font-size: 14px; border-radius: 6px;
    cursor: pointer; -webkit-tap-highlight-color: transparent; font-family: monospace;
}
#debug-panel {
    position: fixed; top: 54px; left: 12px; z-index: 390;
    width: 280px; max-height: calc(100% - 76px); overflow-y: auto;
    -webkit-overflow-scrolling: touch; background: rgba(0,0,0,0.92);
    border: 1px solid #333; border-radius: 6px; padding: 10px 12px; box-sizing: border-box;
    color: #0f0; font-size: 12px; display: none; backdrop-filter: blur(5px);
    scrollbar-width: thin; scrollbar-color: #0f0 #111; font-family: monospace;
}
#debug-panel.open { display: block; }
#debug-panel::-webkit-scrollbar { width: 6px; }
#debug-panel::-webkit-scrollbar-track { background: #111; }
#debug-panel::-webkit-scrollbar-thumb { background: #0f0; border-radius: 3px; }
details { margin-bottom: 4px; border-bottom: 1px solid #1c1c1c; padding-bottom: 6px; }
details:last-of-type { border-bottom: none; }
summary { cursor: pointer; padding: 7px 2px; font-weight: bold; font-size: 13px; color: #0f0; outline: none; user-select: none; list-style: none; display: flex; align-items: center; }
summary::-webkit-details-marker { display: none; }
summary::before { content: '▸'; display: inline-block; width: 14px; transition: transform 0.15s; }
details[open] > summary::before { transform: rotate(90deg); }
.control-group { margin-bottom: 9px; }
.control-group label { display: flex; justify-content: space-between; margin-bottom: 3px; color: #9d9; }
input[type=range] { width: 100%; accent-color: #0f0; height: 18px; }
input[type=color] { width: 100%; height: 26px; border: 1px solid #333; border-radius: 4px; background: none; padding: 0; cursor: pointer; }
.panel-btn { width: 100%; padding: 9px; margin-top: 8px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; box-sizing: border-box; font-family: monospace; }
#btn-copy { background: #0f0; color: #000; border: none; }
#btn-reset { background: transparent; color: #0f0; border: 1px solid #0f0; }
#btn-menu-return { background: #333; color: #fff; border: none; margin-top: 15px; }
.hint { color: #666; font-size: 11px; margin-top: 8px; line-height: 1.5; }
#ending-hint {
    position: fixed; bottom: 8%; left: 50%; transform: translateX(-50%);
    color: rgba(220,220,220,0.9); font-family: monospace; font-size: 14px;
    letter-spacing: 4px; z-index: 600; display: none; text-align: center;
    animation: hintPulse 1.5s infinite;
}
#ending-hint.show { display: block; }
</style>
</head>

<div id="whiteout"></div>
<div id="redflash"></div>

<div id="main-menu">
    <div class="title-container">
        <div class="title-main">无尽长廊</div>
        <div class="title-sub">THE ENDLESS CORRIDOR</div>
    </div>

        <div class="btn" id="btn-w">W</div>
    </div>
    <div id="btn-look">回头</div>
</div>

<div id="btn-fire">开火</div>
<div id="btn-pause">⏸</div>

<div id="threat-ui-container">

<div id="dialog">

    <div class="dlg-cn" id="dlg-cn"></div>

</div>

<div class="free-hint" id="free-hint">W/S 移动 · Shift 奔跑 · Q 回头 · F 开火 · R 喝药</div>

<div id="pause-menu">
    <div class="pause-title">已 暂 停</div>
    <div class="menu-buttons">
        <button class="menu-btn" id="btn-resume">继续游戏</button>
        <button class="menu-btn" id="btn-pause-return">回到主菜单</button>
    </div>
</div>

<div id="toggle-debug">⚙️ 调参</div>
<div id="debug-panel"></div>
<div id="ending-hint">点击屏幕返回主菜单 · 或按 F</div>

function updateThreatUI(percent) {
    if (!threatFill) return;
    percent = Math.max(0, Math.min(100, percent));
    threatFill.style.height = percent + '%';
    if (percent >= 70) {
        threatContainer.classList.add('danger');
        threatFill.style.background = 'rgb(255,' + Math.max(0, 100 - percent) + ',0)';
    } else {
        threatContainer.classList.remove('danger');
        threatFill.style.background = '#8b0000';
    }
}

function updateInventoryUI() {
    const cb = document.getElementById('count-bullet');
    const cp = document.getElementById('count-potion');
    if (cb) cb.textContent = bulletCount;
    if (cp) cp.textContent = potionCount;
    const potSlot = document.querySelector('.inv-slot[data-index="2"]');
    if (potSlot) {
        if (hasShield) potSlot.classList.add('active-buff');
        else potSlot.classList.remove('active-buff');
    }
}

function bindInventory() {
    const slots = document.querySelectorAll('.inv-slot');
    slots.forEach(slot => {
        slot.addEventListener('click', () => {
            slots.forEach(s => s.classList.remove('active'));
            slot.classList.add('active');
            const idx = parseInt(slot.dataset.index);
            if (idx === 2) triggerDrink();
        });
    });
    window.addEventListener('keydown', (e) => {
        if (gameState !== 'playing') return;
        const num = parseInt(e.key);
        if (num >= 1 && num <= 4) {
            slots.forEach(s => s.classList.remove('active'));
            const targetSlot = document.querySelector('.inv-slot[data-index="' + num + '"]');
            if (targetSlot) targetSlot.classList.add('active');
            if (num === 2) triggerDrink();
        }
    });
}

/* ================================================================
   七、程序化纹理
   ================================================================ */
function makeWallTextureCanvas() {
    const S = 512;
    const cv = document.createElement('canvas');
    cv.width = cv.height = S;
    const ctx = cv.getContext('2d');
    const TAU = Math.PI * 2;
    const warm = CFG.toneWarm;
    const br = 138 + warm * 32, bg = 132 + warm * 4, bb = 118 - warm * 32;
    ctx.fillStyle = 'rgb(' + (br|0) + ',' + (bg|0) + ',' + (bb|0) + ')';
    ctx.fillRect(0, 0, S, S);

    const stain = CFG.stainStrength;
    if (stain > 0.001) {
        const blobs = 150;
        const drawBlob = function (px, py, r, fill) {
            const g = ctx.createRadialGradient(px, py, 0, px, py, r);
            g.addColorStop(0, fill); g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, r, 0, TAU); ctx.fill();
        };
        for (let i = 0; i < blobs; i++) {
            const x = Math.random() * S, y = Math.random() * S, r = 14 + Math.random() * 95;
            const dark = Math.random() < 0.66;
            const a = (0.015 + Math.random() * 0.075) * stain;
            const fill = dark ? 'rgba(34,30,24,' + a + ')' : 'rgba(168,162,144,' + (a * 0.75) + ')';
            drawBlob(x, y, r, fill);
            if (x < r) drawBlob(x + S, y, r, fill);
            if (x > S - r) drawBlob(x - S, y, r, fill);
            if (y < r) drawBlob(x, y + S, r, fill);
            if (y > S - r) drawBlob(x, y - S, r, fill);
        }
    }

    const rows = Math.max(2, Math.round(CFG.brickRows)), cols = Math.max(2, Math.round(CFG.brickCols));
    const rowH = S / rows, gapDark = CFG.brickGapDark;
    ctx.strokeStyle = 'rgba(28,25,21,' + (0.4 * gapDark) + ')'; ctx.lineWidth = 2.5;
    for (let i = 0; i <= rows; i++) { ctx.beginPath(); ctx.moveTo(0, i * rowH); ctx.lineTo(S, i * rowH); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(28,25,21,' + (0.32 * gapDark) + ')'; ctx.lineWidth = 2;
    for (let r = 0; r < rows; r++) {
        const offset = (r % 2) * (S / cols / 2);
        for (let c = 0; c <= cols; c++) {
            const x = (c * S / cols + offset) % S;
            ctx.beginPath(); ctx.moveTo(x, r * rowH + 1); ctx.lineTo(x, (r + 1) * rowH - 1); ctx.stroke();
        }
    }
    ctx.strokeStyle = 'rgba(205,198,178,0.09)'; ctx.lineWidth = 1;
    for (let i = 1; i < rows; i++) { ctx.beginPath(); ctx.moveTo(0, i * rowH + 2); ctx.lineTo(S, i * rowH + 2); ctx.stroke(); }

    const cracks = Math.round(CFG.crackCount);
    if (cracks > 0) {
        ctx.strokeStyle = 'rgba(22,19,16,0.38)'; ctx.lineWidth = 1;
        for (let i = 0; i < cracks; i++) {
            let x = Math.random() * S, y = Math.random() * S, ang = Math.random() * TAU;
            ctx.beginPath(); ctx.moveTo(x, y);
            const segs = 4 + Math.floor(Math.random() * 8);
            for (let s = 0; s < segs; s++) {
                ang += (Math.random() - 0.5) * 1.3; const len = 4 + Math.random() * 15;
                x += Math.cos(ang) * len; y += Math.sin(ang) * len; ctx.lineTo(x, y);
            }
            ctx.stroke();
        }
    }

    const grainAmt = CFG.grainStrength;
    if (grainAmt > 0.005) {
        const img = ctx.getImageData(0, 0, S, S), d = img.data, amt = grainAmt * 58;
        for (let i = 0; i < d.length; i += 4) {
            const n = (Math.random() - 0.5) * amt;
            d[i] = Math.max(0, Math.min(255, d[i] + n));
            d[i+1] = Math.max(0, Math.min(255, d[i+1] + n));
            d[i+2] = Math.max(0, Math.min(255, d[i+2] + n));
        }
        ctx.putImageData(img, 0, 0);
    }
    return cv;
}

function rebuildTexture() {
    if (baseTexture) baseTexture.dispose();
    baseTexture = new THREE.CanvasTexture(makeWallTextureCanvas());
    baseTexture.wrapS = baseTexture.wrapT = THREE.RepeatWrapping;
    baseTexture.encoding = THREE.sRGBEncoding;
    baseTexture.anisotropy = maxAniso;
    cloneTexTo(wallMat); cloneTexTo(floorMat); cloneTexTo(ceilMat);
    applyTiling();
}
function cloneTexTo(mat) {
    const t = baseTexture.clone();
    t.needsUpdate = true; t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.encoding = THREE.sRGBEncoding; t.anisotropy = maxAniso;
    if (mat.map && mat.map !== t) mat.map.dispose();
    mat.map = t; mat.bumpMap = t; mat.needsUpdate = true;
}
function applyTiling() {
    const t = CFG.wallTiling;
    setRepeat(wallMat, CFG.chunkLength / 2 * t, CFG.ceilingHeight / 2 * t);
    setRepeat(ceilMat, CFG.chunkLength / 2 * t, CFG.ceilingHeight / 2 * t);
    setRepeat(floorMat, CFG.corridorWidth / 2 * t, CFG.chunkLength / 2 * t);
}
function setRepeat(mat, rx, ry) { if (mat.map) mat.map.repeat.set(rx, ry); }
function applyWallBrightness(v) {
    const c = Math.max(0, Math.min(1, v / 255));
    wallMat.color.setRGB(c, c, c); ceilMat.color.setRGB(c, c, c);
    floorMat.color.setRGB(c * 0.78, c * 0.78, c * 0.78);
}
let texTimer = null;
function requestTextureRebuild() {
    if (texTimer) return;
    texTimer = setTimeout(() => { texTimer = null; rebuildTexture(); }, 140);
}

function createChunk(index) {
    const g = new THREE.Group();

    const leftWall = new THREE.Mesh(geoWall, wallMat); leftWall.position.set(-W / 2, H / 2, halfZ); g.add(leftWall);

    const ridges = Math.round(CFG.ridges);

/* ================================================================
   十、后期
   ================================================================ */
const POST_VERT = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }';
const POST_FRAG = `
precision highp float; varying vec2 vUv;
uniform sampler2D tDiffuse;
uniform vec2 uResolution;
uniform float uExposure, uContrast, uSaturation, uVignette;
uniform float uGrain, uChroma, uBlur, uScanline, uCurve;
uniform float uBlink, uFade, uTime;
vec3 aces(vec3 x){ float a=2.51,b=0.03,c=2.43,d=0.59,e=0.14; return clamp((x*(a*x+b))/(x*(c*x+d)+e),0.0,1.0); }
float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
vec3 sampleAt(vec2 uv){
    float ca = uChroma * (0.35 + length(uv-0.5));
    vec3 c;
    c.r = texture2D(tDiffuse, uv + vec2(ca, 0.0)).r;
    c.g = texture2D(tDiffuse, uv).g;
    c.b = texture2D(tDiffuse, uv - vec2(ca, 0.0)).b;
    return c;
}
void main(){
    vec2 cc = vUv - 0.5;
    float r2 = dot(cc, cc);
    vec2 uv = 0.5 + cc * (1.0 + uCurve * r2);
    vec2 texel = 1.0 / uResolution;
    vec3 col;
    if (uBlur < 0.02) { col = sampleAt(uv); }
    else {
        col = vec3(0.0); float total = 0.0;
        for (int i = -1; i <= 1; i++){
            for (int j = -1; j <= 1; j++){
                float fi = float(i), fj = float(j);
                vec2 off = vec2(fi, fj) * texel * uBlur;
                float w = (i==0 && j==0) ? 4.0 : ((abs(fi)+abs(fj)==1.0) ? 2.0 : 1.0);
                col += sampleAt(uv + off) * w; total += w;
            }
        }
        col /= total;
    }
    col *= uExposure;
    col = aces(col);
    col = (col - 0.5) * uContrast + 0.5;
    float luma = dot(col, vec3(0.299,0.587,0.114));
    col = mix(vec3(luma), col, uSaturation);
    float s = sin(uv.y * uResolution.y * 0.45) * 0.5 + 0.5;
    col *= 1.0 - uScanline * s * 0.30;
    vec2 d = uv - 0.5;
    float vig = 1.0 - dot(d, d) * uVignette * 2.8;
    col *= clamp(vig, 0.0, 1.0);
    float n = hash21(uv * uResolution + fract(uTime) * 137.0);
    col += (n - 0.5) * uGrain;
    vec2 ed = min(uv, 1.0 - uv);
    col *= smoothstep(0.0, 0.012, min(ed.x, ed.y));
    float bot = mix(-0.06, 0.53, uBlink);
    float top = mix( 1.06, 0.49, uBlink);
    float lid = smoothstep(bot - 0.035, bot + 0.035, vUv.y)
              * (1.0 - smoothstep(top - 0.035, top + 0.035, vUv.y));
    col *= lid;
    col *= uFade;
    col = pow(max(col, 0.0), vec3(1.0/2.2));
    gl_FragColor = vec4(col, 1.0);
}`;

function initPost() {
    const w = window.innerWidth, h = window.innerHeight;
    const rtType = renderer.capabilities.isWebGL2 ? THREE.HalfFloatType : THREE.UnsignedByteType;
    rt = new THREE.WebGLRenderTarget(w, h, {
        minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
        format: THREE.RGBAFormat, type: rtType, depthBuffer: true, stencilBuffer: false
    });
    postUniforms = {
        tDiffuse: { value: null }, uResolution: { value: new THREE.Vector2(w, h) },
        uExposure: { value: CFG.exposure }, uContrast: { value: CFG.contrast }, uSaturation: { value: CFG.saturation },
        uVignette: { value: CFG.vignette }, uGrain: { value: CFG.grain }, uChroma: { value: CFG.chroma },
        uBlur: { value: CFG.blur }, uScanline: { value: CFG.scanline }, uTime: { value: 0 },
        uCurve: { value: 0.0 }, uBlink: { value: 0.0 }, uFade: { value: 1.0 }
    };
    postMat = new THREE.ShaderMaterial({
        uniforms: postUniforms, vertexShader: POST_VERT, fragmentShader: POST_FRAG,
        depthTest: false, depthWrite: false
    });
    postScene = new THREE.Scene();
    postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));
}
const POST_MAP = { exposure:'uExposure', contrast:'uContrast', saturation:'uSaturation', vignette:'uVignette', grain:'uGrain', chroma:'uChroma', blur:'uBlur', scanline:'uScanline' };

/* ================================================================
   十一、参数分发
   ================================================================ */
function onParamChange(key, v) {
    switch (key) {
        case 'lightIntensity': playerLight.intensity = v; break;
        case 'lightDistance': playerLight.distance = v; break;
        case 'lightColor': playerLight.color.set(v); break;
        case 'ambient': corridorAmbient.intensity = v; break;
        case 'ambientColor': corridorAmbient.color.set(v); break;
        case 'fogDensity': scene.fog.density = v; break;
        case 'fogColor': scene.fog.color.set(v); scene.background.set(v); break;
        case 'wallBrightness': applyWallBrightness(v); break;
        case 'wallTiling': applyTiling(); break;
        case 'bumpScale': wallMat.bumpScale = v; floorMat.bumpScale = v; ceilMat.bumpScale = v; break;
        case 'roughness': wallMat.roughness = v; floorMat.roughness = v; ceilMat.roughness = v; break;
        case 'stainStrength': case 'grainStrength': case 'crackCount':
        case 'brickRows': case 'brickCols': case 'brickGapDark': case 'toneWarm':
            requestTextureRebuild(); break;
        case 'corridorWidth': case 'ceilingHeight': case 'chunkLength': rebuildGeometry(); break;
        case 'ridges': case 'debris': rebuildChunks(); break;
        case 'lookYawAngle': case 'lookPitchAngle':
            if (lookPhase === 'back' || lookPhase === 'hold') {
                targetYaw = CFG.lookYawAngle * DEG; targetPitch = CFG.lookPitchAngle * DEG;
                lookPhase = 'back'; lookPhaseTimer = 0; updateLookBtn();
            } break;
        case 'lookSpeed': case 'lookHoldTime': case 'lookSlow': case 'lookCooldown': updateLookBtn(); break;
        case 'staminaMax':
            if (stamina > v) stamina = v;
            savedStamina = stamina; updateStaminaUI(); break;
        case 'staminaWarnThreshold': updateStaminaUI(); break;
        case 'audioVolume': if (masterGain && audioCtx) masterGain.gain.setTargetAtTime(v, audioCtx.currentTime, 0.1); break;
        default: if (POST_MAP[key]) postUniforms[POST_MAP[key]].value = v; break;
    }
}

/* ================================================================
   十二、回头 / 体力
   ================================================================ */
function isLookBusy() { return lookPhase === 'back' || lookPhase === 'hold' || lookPhase === 'forward'; }
function getLookSpeedMul() { return isLookBusy() ? CFG.lookSlow : 1; }

function startLookBack() {
    if (lookPhase !== 'idle') return false;
    lookPhase = 'back'; lookPhaseTimer = 0; lookJudged = false;
    targetYaw = CFG.lookYawAngle * DEG; targetPitch = CFG.lookPitchAngle * DEG;
    updateLookBtn(); return true;
}

function updateLookState(dt) {
    if (lookPhase === 'idle') return;
    const settled = Math.abs(targetYaw - lookYaw) < LOOK_SETTLE_EPS && Math.abs(targetPitch - lookPitch) < LOOK_SETTLE_EPS;
    if (lookPhase === 'back') {
        if (settled) { lookPhase = 'hold'; lookPhaseTimer = 0; lookJudged = false; updateLookBtn(); }
    } else if (lookPhase === 'hold') {
        if (!lookJudged) {
            lookJudged = true;
            if (backMonster && backMonster.retreatTimer <= 0 && backMonster.spawnGrace <= 0) {
                if (backMonster.dist <= 4 && backMonster.dist >= 1) {
                    backMonster.retreatTimer = 2.0;
                    backMonster.dist = 8;
                    camShake = Math.max(camShake, 0.3);
                } else if (backMonster.dist > 4 && backMonster.dist <= CFG.warnDist) {
                    addThreat(2);
                }
            }
        }
        lookPhaseTimer += dt;
        if (lookPhaseTimer >= CFG.lookHoldTime) {
            targetYaw = 0; targetPitch = 0; lookPhase = 'forward'; lookPhaseTimer = 0; updateLookBtn();
        }
    } else if (lookPhase === 'forward') {
        if (settled) { lookPhase = 'cooldown'; lookPhaseTimer = 0; updateLookBtn(); }
    } else if (lookPhase === 'cooldown') {
        lookPhaseTimer += dt;
        if (lookPhaseTimer >= CFG.lookCooldown) { lookPhase = 'idle'; lookPhaseTimer = 0; }
        updateLookBtn();
    }
}

function updateLookBtn() {
    const btn = document.getElementById('btn-look');
    if (!btn) return;
    let txt = '回头', active = false, cooling = false;
    if (lookPhase === 'back' || lookPhase === 'hold') { txt = '回头中'; active = true; }
    else if (lookPhase === 'forward') { txt = '回正'; active = true; }
    else if (lookPhase === 'cooldown') { txt = '冷却 ' + Math.ceil(Math.max(0, CFG.lookCooldown - lookPhaseTimer)); cooling = true; }
    if (btn.textContent !== txt) btn.textContent = txt;
    btn.classList.toggle('active', active);
    btn.classList.toggle('cooldown', cooling);
}

function updateStaminaUI() {
    if (!staminaFill) return;
    const pct = Math.max(0, Math.min(1, stamina / CFG.staminaMax));
    staminaFill.style.width = (pct * 100) + '%';
    staminaFill.style.backgroundColor = (isExhausted || pct * 100 < CFG.staminaWarnThreshold) ? '#ff3333' : '#ffffff';
}

function initAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = CFG.audioVolume;
    masterGain.connect(audioCtx.destination);

    corridorGain = audioCtx.createGain();
    corridorGain.gain.value = 1.0;
    corridorGain.connect(masterGain);

    const osc1 = audioCtx.createOscillator(); osc1.type = 'sine'; osc1.frequency.value = 40;
    const gain1 = audioCtx.createGain(); gain1.gain.value = 0.06; osc1.connect(gain1); gain1.connect(corridorGain); osc1.start();
    const osc2 = audioCtx.createOscillator(); osc2.type = 'sine'; osc2.frequency.value = 44;
    const gain2 = audioCtx.createGain(); gain2.gain.value = 0.06; osc2.connect(gain2); gain2.connect(corridorGain); osc2.start();

    const bufferSize = audioCtx.sampleRate * 5;
    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const output = noiseBuffer.getChannelData(0); let lastOut = 0.0;
    for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        output[i] = (lastOut + (0.02 * white)) / 1.02; lastOut = output[i]; output[i] *= 3.5;
    }
    const noiseSource = audioCtx.createBufferSource(); noiseSource.buffer = noiseBuffer; noiseSource.loop = true;
    const noiseFilter = audioCtx.createBiquadFilter(); noiseFilter.type = 'lowpass'; noiseFilter.frequency.value = 250;
    const noiseGain = audioCtx.createGain(); noiseGain.gain.value = 0.1;
    noiseSource.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(corridorGain); noiseSource.start();

    const lfo = audioCtx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.08;
    const lfoGain = audioCtx.createGain(); lfoGain.gain.value = 0.05;
    lfo.connect(lfoGain); lfoGain.connect(noiseGain.gain); lfo.start();

    audioTimer = setInterval(() => {
        if (!audioCtx || audioCtx.state !== 'running' || Math.random() > 0.4) return;
        const t = audioCtx.currentTime;
        const pulseOsc = audioCtx.createOscillator(); pulseOsc.type = 'triangle';
        pulseOsc.frequency.setValueAtTime(55, t); pulseOsc.frequency.exponentialRampToValueAtTime(25, t + 2);
        const pulseGain = audioCtx.createGain();
        pulseGain.gain.setValueAtTime(0, t); pulseGain.gain.linearRampToValueAtTime(0.2, t + 0.3); pulseGain.gain.exponentialRampToValueAtTime(0.001, t + 2.5);
        pulseOsc.connect(pulseGain); pulseGain.connect(corridorGain); pulseOsc.start(t); pulseOsc.stop(t + 3);
    }, 8000);
}
function ensureAudio() {
    if (!audioCtx) initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#080101';
    ctx.shadowColor = '#660000';
    ctx.shadowBlur = 10;
    if (isFront) {
        ctx.beginPath(); ctx.ellipse(128, 120, 20, 30, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(120, 120); ctx.lineTo(50, 180); ctx.lineTo(20, 220); ctx.lineTo(30, 230); ctx.lineTo(70, 190); ctx.fill();
        ctx.beginPath(); ctx.moveTo(136, 120); ctx.lineTo(206, 180); ctx.lineTo(236, 220); ctx.lineTo(226, 230); ctx.lineTo(186, 190); ctx.fill();
        ctx.beginPath(); ctx.moveTo(120, 140); ctx.lineTo(40, 250); ctx.lineTo(30, 256); ctx.fill();
        ctx.beginPath(); ctx.moveTo(136, 140); ctx.lineTo(216, 250); ctx.lineTo(226, 256); ctx.fill();
    } else {
        ctx.beginPath(); ctx.ellipse(128, 60, 15, 25, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(120, 80); ctx.lineTo(136, 80); ctx.lineTo(140, 200); ctx.lineTo(116, 200); ctx.fill();
        ctx.beginPath(); ctx.moveTo(120, 80); ctx.lineTo(20, 50); ctx.lineTo(10, 70); ctx.lineTo(110, 100); ctx.fill();
        ctx.beginPath(); ctx.moveTo(136, 80); ctx.lineTo(236, 50); ctx.lineTo(246, 70); ctx.lineTo(146, 100); ctx.fill();
        ctx.beginPath(); ctx.moveTo(116, 150); ctx.lineTo(10, 180); ctx.lineTo(10, 200); ctx.lineTo(120, 170); ctx.fill();
        ctx.beginPath(); ctx.moveTo(140, 150); ctx.lineTo(246, 180); ctx.lineTo(246, 200); ctx.lineTo(136, 170); ctx.fill();
    }
    const tex = new THREE.CanvasTexture(cv);
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 1, depthWrite: false });
    const sprite = new THREE.Sprite(mat);

    if (isFront) {
        sprite.scale.set(2.4, 2.4, 1);
        const d0 = CFG.frontSpawnDist;
        sprite.position.set(0, 1.2, currentZ - d0);
        frontMonster = { mesh: sprite, dist: d0, hp: CFG.monsterHp, retreatTimer: 0, spawnGrace: CFG.spawnGrace };
    } else {
        sprite.scale.set(2.6, 2.6, 1);
        const d0 = CFG.backSpawnDist;
        sprite.position.set(0, 1.3, currentZ + d0);
        backMonster = { mesh: sprite, dist: d0, hp: CFG.monsterHp, retreatTimer: 0, spawnGrace: CFG.spawnGrace };
    }
    scene.add(sprite);
}

function updateMonsters(dt) {
    if (frontMonster) {
        const m = frontMonster;
        if (m.spawnGrace > 0) {
            m.spawnGrace -= dt;
        } else if (m.retreatTimer > 0) {
            m.retreatTimer -= dt;
            m.dist += 5 * dt;
            if (m.dist > CFG.frontSpawnDist) { scene.remove(m.mesh); frontMonster = null; }
        } else {
            let speed = CFG.monsterFrontSpeed;
            if (isMovingBackward) speed = CFG.monsterFrontChase;
            m.dist -= speed * dt;
            if (m.dist <= 1) handleFaceHug(true);
        }
        if (frontMonster === m) m.mesh.position.z = currentZ - m.dist;
    }

    if (backMonster) {
        const m = backMonster;
        if (m.spawnGrace > 0) {
            m.spawnGrace -= dt;
        } else if (m.retreatTimer > 0) {
            m.retreatTimer -= dt;
            m.dist += 6 * dt;
            if (m.dist > CFG.backSpawnDist) { scene.remove(m.mesh); backMonster = null; }
        } else {
            let speed = isMovingForward ? CFG.monsterBackSpeed : CFG.monsterBackIdle;
            m.dist -= speed * dt;
            if (m.dist <= 1) handleFaceHug(false);
        }
        if (backMonster === m) m.mesh.position.z = currentZ + m.dist;
    }
}

function handleFaceHug(isFront) {
    if (isFront) {
        if (hasShield) {
            hasShield = false;
            updateInventoryUI();
            camShake = 0.5;
        } else {
            addThreat(CFG.faceHugDamage);
            camShake = 1.0;
        }
        frontMonster.retreatTimer = 2.0;
        frontMonster.dist = CFG.frontSpawnDist;
        frontMonster.spawnGrace = CFG.spawnGrace;
    } else {
        gameOver("你被背后的怪物吞噬了...");
    }
}

function addThreat(amount) {
    if (gameState !== 'playing') return;
    threatValue = Math.max(0, Math.min(MAX_THREAT, threatValue + amount));
    updateThreatUI(threatValue);
    if (threatValue >= MAX_THREAT) gameOver("阈限值达到极限，你陷入了疯狂...");
}

function triggerWarning(show) {
    if (redflash) redflash.style.opacity = show ? '1' : '0';
}

/* ================================================================
   十六、掉落
   ================================================================ */
function spawnDrop(forceType) {
    let type = forceType;
    if (!type) {
        const r = Math.random();
        if (r < CFG.bulletChance) type = 'bullet';
        else if (r < CFG.bulletChance + CFG.potionChance) type = 'potion';
    }
    if (!type) return;

    const geo = new THREE.CylinderGeometry(0.1, 0.1, 0.2, 8);
    const mat = new THREE.MeshStandardMaterial({
        color: type === 'bullet' ? 0xa8862c : 0x8b3fd6,
        emissive: type === 'bullet' ? 0x332200 : 0x220055
    });
    const mesh = new THREE.Mesh(geo, mat);
    const zPos = currentZ - 15 - Math.random() * 20;
    mesh.position.set((Math.random() - 0.5) * 1.5, 0.4, zPos);
    scene.add(mesh);
    drops.push({ mesh, type, z: zPos });
}

function updateDrops(dt) {
    for (let i = drops.length - 1; i >= 0; i--) {
        const d = drops[i];
        d.mesh.rotation.y += 2 * dt;
        d.mesh.position.y = 0.4 + Math.sin(clockTime * 2) * 0.1;
        if (d.z > currentZ + 10) { scene.remove(d.mesh); drops.splice(i, 1); continue; }
        if (Math.abs(d.z - currentZ) < 1.5) {
            if (d.type === 'bullet') bulletCount = Math.min(CFG.maxBullet, bulletCount + 1);
            if (d.type === 'potion') potionCount = Math.min(CFG.maxPotion, potionCount + 1);
            scene.remove(d.mesh);
            drops.splice(i, 1);
            updateInventoryUI();
        }
    }
}

/* ================================================================
   十七、武器动作
   ================================================================ */
function triggerFire() {
    if (gameState !== 'playing') return;
    if (isFiring || isDrinking || bulletCount <= 0) return;
    isFiring = true;
    fireTime = 0;
    bulletCount--;
    updateInventoryUI();
    pistolLight.intensity = CFG.muzzleFlashIntensity;
    playGunSound();
    camShake = Math.max(camShake, 0.12);

    /* 子弹打背后怪 */
    if (backMonster && backMonster.dist < 10 && backMonster.retreatTimer <= 0 && backMonster.spawnGrace <= 0) {
        backMonster.hp -= CFG.weaponDamage;
        if (backMonster.hp <= 0) {
            scene.remove(backMonster.mesh);
            backMonster = null;
            addThreat(-15);
            /* 击杀背后怪 → 触发结局 */
            triggerEnding();
        } else {
            backMonster.retreatTimer = 1.5;
            backMonster.dist += 2;
        }
    }
}

function triggerDrink() {
    if (gameState !== 'playing') return;
    if (isDrinking || isFiring || potionCount <= 0) return;
    isDrinking = true;
    drinkTime = 0;
    potionCount--;
    updateInventoryUI();
    if (potionGroup) potionGroup.visible = true;
}

function updateWeaponAnim(dt) {
    if (isFiring) {
        fireTime += dt;
        if (fireTime < 0.1) {
            pistolGroup.rotation.z = Math.sin(fireTime / 0.1 * Math.PI) * 0.4;
        } else if (fireTime < 0.3) {
            pistolGroup.rotation.z = 0;
            pistolSlide.position.x = -Math.sin((fireTime - 0.1) / 0.2 * Math.PI) * 0.06;
        } else {
            isFiring = false;
            pistolSlide.position.x = 0;
            pistolLight.intensity = 0;
        }
    }
    if (isDrinking) {
        drinkTime += dt;
        if (drinkTime < 0.5) {
            potionGroup.position.y = -0.5 + (drinkTime / 0.5) * 0.3;
        } else if (drinkTime < 2.5) {
            potionGroup.position.y = -0.2;
            potionGroup.rotation.z = -0.5;
            if (potionLiquid.scale.y > 0.1) potionLiquid.scale.y -= dt * 0.5;
        } else if (drinkTime < 3.5) {
            potionGroup.position.y = -0.2 - ((drinkTime - 2.5) / 1.0) * 0.3;
            potionGroup.rotation.z = 0;
        } else {
            isDrinking = false;
            potionGroup.position.y = -0.5;
            potionLiquid.scale.y = 1;
            potionGroup.visible = false;
            hasShield = true;
            updateInventoryUI();
        }
    }
}

/* ================================================================
   十八、战斗重置 / 清理
   ================================================================ */
function resetCombat() {
    threatValue = 0;
    bulletCount = CFG.startBullet;
    potionCount = CFG.startPotion;
    hasShield = false;
    gamePlayTime = 0;
    frontSpawnTimer = CFG.frontSpawnDelay;
    backSpawnTimer = CFG.monsterSpawnMin;
    dropTimer = CFG.monsterSpawnMin;
    potionDropTimer = 45;
    camShake = 0;
    isFiring = false; isDrinking = false;
    fireTime = 0; drinkTime = 0;

    if (frontMonster) { scene.remove(frontMonster.mesh); frontMonster = null; }
    if (backMonster) { scene.remove(backMonster.mesh); backMonster = null; }
    drops.forEach(d => scene.remove(d.mesh)); drops = [];

    if (pistolGroup) { pistolGroup.rotation.z = 0; pistolSlide.position.x = 0; }
    if (pistolLight) pistolLight.intensity = 0;
    if (potionGroup) { potionGroup.position.y = -0.5; potionGroup.rotation.z = 0; potionGroup.visible = false; }
    if (potionLiquid) potionLiquid.scale.y = 1;

    triggerWarning(false);
    updateThreatUI(0);
    updateInventoryUI();
}

function cleanupCombat() {
    if (frontMonster) { scene.remove(frontMonster.mesh); frontMonster = null; }
    if (backMonster) { scene.remove(backMonster.mesh); backMonster = null; }
    drops.forEach(d => scene.remove(d.mesh)); drops = [];
    triggerWarning(false);
    setCombatVisible(false);
}

/* ================================================================

function bindMenuButtons() {
    const btnNew = document.getElementById('btn-new');
    const btnContinue = document.getElementById('btn-continue');
    const btnSettings = document.getElementById('btn-settings');
    const btnResume = document.getElementById('btn-resume');
    const btnPauseReturn = document.getElementById('btn-pause-return');

    btnNew.addEventListener('click', startNewGame);

    btnContinue.addEventListener('click', () => {
        if (!hasSave) return;
        ensureAudio();
        currentZ = savedZ;
        stamina = savedStamina;
        isExhausted = false;
        isMovingForward = false; isMovingBackward = false; isRunInput = false;
        updateStaminaUI();
        enterPlayState(true);
    });

    btnSettings.addEventListener('click', () => {
        document.getElementById('debug-panel').classList.toggle('open');
    });

    btnResume.addEventListener('click', resumeGame);
    btnPauseReturn.addEventListener('click', () => {
        document.getElementById('pause-menu').classList.remove('show');
        returnToMenu();
    });

    btnPauseEl.addEventListener('click', pauseGame);
}

function updateContinueBtn() {
    const btnContinue = document.getElementById('btn-continue');
    if (!btnContinue) return;
    if (hasSave) {
        btnContinue.disabled = false;
        btnContinue.textContent = '继续游戏';
    } else {
        btnContinue.disabled = true;
        btnContinue.textContent = '继续游戏 (无存档)';
    }
}

function startNewGame() {
    ensureAudio();
    currentZ = 0;
    stamina = CFG.staminaMax;
    isExhausted = false;
    walkTime = 0;
    lookPhase = 'idle'; lookYaw = 0; lookPitch = 0; targetYaw = 0; targetPitch = 0; roll = 0;
    isMovingForward = false; isMovingBackward = false; isRunInput = false;
    currentStep = 0;
    inCorridor = false;
    camAnim = null;
    actionState = null;
    typingState = null;
    introPhase = 'idle';
    updateThreatUI(0);
    updateStaminaUI();

    mainMenuEl.classList.add('hidden');
    gameUIEl.style.display = 'none';
    btnLookEl.style.display = 'none';
    btnFireEl.style.display = 'none';
    btnPauseEl.style.display = 'none';
    crosshairEl.style.display = 'none';

    document.getElementById('ending-hint').classList.remove('show');

/* ================================================================
   二十一、存档 / 返回
   ================================================================ */
function saveSnapshot() {
    savedZ = currentZ;
    savedStamina = stamina;
    savedBullet = bulletCount;
    savedPotion = potionCount;
    savedThreat = threatValue;
    savedShield = hasShield;
    hasSave = true;
    updateContinueBtn();
}

function returnToMenu() {
    if (gameState === 'playing' || gameState === 'paused') {
        saveSnapshot();
    }

    gameState = 'menu';
    introPhase = 'idle';
    camAnim = null; actionState = null; typingState = null;
    inCorridor = false;

    isMovingForward = false; isMovingBackward = false; isRunInput = false;
    lookPhase = 'idle'; lookYaw = 0; lookPitch = 0; targetYaw = 0; targetPitch = 0; roll = 0;
    updateLookBtn();

    dialogEl.classList.remove('show');
    whiteout.style.transition = 'none';
    whiteout.style.opacity = '0';
    freeHint.classList.remove('show');
    document.getElementById('pause-menu').classList.remove('show');
    document.getElementById('ending-hint').classList.remove('show');

    cleanupCombat();

    if (corridorGain && audioCtx) {
        corridorGain.gain.setTargetAtTime(1.0, audioCtx.currentTime, 0.3);
    }
    if (masterGain && audioCtx) {
        masterGain.gain.setTargetAtTime(CFG.audioVolume, audioCtx.currentTime, 0.3);
    }

    document.getElementById('debug-panel').classList.remove('open');
    mainMenuEl.classList.remove('hidden');
    gameUIEl.style.display = 'none';
    btnLookEl.style.display = 'none';
    btnFireEl.style.display = 'none';
    btnPauseEl.style.display = 'none';
    crosshairEl.style.display = 'none';

    enterMenuState();
}

function gameOver(msg) {
    cleanupCombat();
    gameState = 'menu';
    inCorridor = false;
    introPhase = 'idle';

    hasSave = false;
    updateContinueBtn();

    gameUIEl.style.display = 'none';
    btnLookEl.style.display = 'none';

}

/* ================================================================
   二十三、缓动 / 字幕
   ================================================================ */
function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

function startSubtitle(en, cn) {
    introPhase = 'typing';
    dialogEl.classList.add('show');
    dlgEn.textContent = '';
    dlgCn.textContent = '';
    dlgCn.classList.remove('show');
    dlgHint.classList.remove('show');
    const cursorEl = document.createElement('span');
    cursorEl.className = 'cursor';
    dlgEn.appendChild(cursorEl);
    typingState = { full: en, cn: cn, index: 0, timer: 0, interval: 0.055, finished: false };
}
function renderTyping() {
    if (!typingState) return;
    dlgEn.textContent = typingState.full.substring(0, typingState.index);
    if (!typingState.finished) {
        const c = document.createElement('span');
        c.className = 'cursor';
        dlgEn.appendChild(c);
    }
}
function updateTyping(dt) {
    if (!typingState || typingState.finished) return;
    typingState.timer += dt;
    let changed = false;
    while (typingState.timer >= typingState.interval && typingState.index < typingState.full.length) {
        typingState.timer -= typingState.interval;
        typingState.index++;
        playKeySound();
        changed = true;
    }
    if (changed) renderTyping();
    if (typingState.index >= typingState.full.length && !typingState.finished) {
        typingState.finished = true;
        renderTyping();
        const ts = typingState;
        setTimeout(function () {
            dlgCn.textContent = ts.cn;
            dlgCn.classList.add('show');
            setTimeout(function () {
                if (introPhase === 'typing' || introPhase === 'waiting') {
                    introPhase = 'waiting';
                    dlgHint.classList.add('show');
                }
            }, 400);
        }, 200);
    }
}
function finishTypingNow() {
    if (!typingState || typingState.finished) return;
    typingState.index = typingState.full.length;
    typingState.finished = true;
    renderTyping();
    dlgCn.textContent = typingState.cn;
    dlgCn.classList.add('show');
    introPhase = 'waiting';
    dlgHint.classList.add('show');
}

/* ================================================================
   二十四、相机动画 / 演出
   ================================================================ */
function startCameraAnim(from, to, duration) {
    introPhase = 'anim';
    camAnim = { from: from, to: to, duration: duration, t: 0 };
}
function updateCameraAnim(dt) {
    if (!camAnim) return false;
    camAnim.t += dt;
    const u = Math.min(1, camAnim.t / camAnim.duration);
    const e = easeInOutCubic(u);
    const fp = camAnim.from.pitch * DEG, tp = camAnim.to.pitch * DEG;
    const fy = camAnim.from.yaw * DEG, ty = camAnim.to.yaw * DEG;
    const fr = camAnim.from.roll * DEG, tr = camAnim.to.roll * DEG;
    camera.rotation.x = fp + (tp - fp) * e;
    camera.rotation.y = fy + (ty - fy) * e;
    camera.rotation.z = fr + (tr - fr) * e;
    if (u >= 1) { camAnim = null; return true; }
    return false;
}
const phoneWhite = new THREE.Color(0xffffff);
const phoneRed = new THREE.Color(0xff2222);
function startAction(name, duration) {
    introPhase = 'anim';
    actionState = { name: name, duration: duration, t: 0 };
    if (name === 'phoneRed') phoneLight.intensity = 0.7;
    if (name === 'screenBlast') whiteout.style.transition = 'none';
    if (name === 'holdWhite') {
        whiteout.style.transition = 'none';
        whiteout.style.opacity = '1';
    }
    if (name === 'fadeWhite') {
        switchToCorridor();
        whiteout.style.transition = 'none';
        void whiteout.offsetWidth;
        whiteout.style.transition = 'opacity 2.5s ease-out';
        whiteout.style.opacity = '0';
    }
}
function updateAction(dt) {
    if (!actionState) return false;
    actionState.t += dt;
    const u = Math.min(1, actionState.t / actionState.duration);
    if (actionState.name === 'phoneRed') {
        const col = phoneWhite.clone().lerp(phoneRed, u);
        phoneScreenMat.color.copy(col);
        phoneLight.color.copy(col);
    } else if (actionState.name === 'phonePulse') {
        const pulse = 0.55 + Math.sin(u * Math.PI * 4) * 0.45;
        phoneLight.intensity = 0.4 + pulse * 0.8;
    } else if (actionState.name === 'screenBlast') {
        matScreen.emissiveIntensity = 1.8 + u * 14;
        screenLight.intensity = 1.2 + u * 10;
        postUniforms.uExposure.value = 1.0 + u * 3.0;
        if (u > 0.5) whiteout.style.opacity = String((u - 0.5) * 2);
    } else if (actionState.name === 'standUp') {
        const e = easeOutCubic(u);
        camera.position.y = 0.18 + (CFG.eyeHeight - 0.18) * e;
        camera.rotation.x = 18 * DEG * (1 - e);
        camera.rotation.y = -35 * DEG * (1 - e);
        camera.rotation.z = 80 * DEG * (1 - e);
    }
    if (u >= 1) { actionState = null; return true; }
    return false;
}

const STEPS = [
    { type: 'subtitle', en: "Finally... I've finished this project.", cn: "（这个项目终于我做完了）" },
    { type: 'camera', duration: 1.2, from: { pitch: -3, yaw: 0, roll: 0 }, to: { pitch: -38.5, yaw: 13, roll: -6 } },
    { type: 'subtitle', en: "I don't think I'll ever forget this day.", cn: "（我大概永远忘不了这一天）" },
    { type: 'anim', duration: 0.6, action: 'phoneRed' },
    { type: 'anim', duration: 0.9, action: 'phonePulse' },
    { type: 'camera', duration: 1.2, from: { pitch: -38.5, yaw: 13, roll: -6 }, to: { pitch: -3, yaw: 0, roll: 0 } },
    { type: 'anim', duration: 0.8, action: 'screenBlast' },
    { type: 'anim', duration: 0.5, action: 'holdWhite' },
    { type: 'anim', duration: 2.5, action: 'fadeWhite' },
    { type: 'subtitle', en: "Damn it... where am I? No. I need to find a way out.", cn: "（该死，这是哪里？不行，我需要想个办法逃出这里）" },
    { type: 'anim', duration: 1.5, action: 'standUp' },
    { type: 'end' }
];
function runStep() {
    if (currentStep >= STEPS.length) return;
    const step = STEPS[currentStep];
    currentStep++;
    if (step.type === 'subtitle') startSubtitle(step.en, step.cn);
    else if (step.type === 'camera') startCameraAnim(step.from, step.to, step.duration);
    else if (step.type === 'anim') startAction(step.action, step.duration);
    else if (step.type === 'end') {
        introPhase = 'done';
        dialogEl.classList.remove('show');
        dlgHint.classList.remove('show');
        postUniforms.uSaturation.value = CFG.saturation;
        postUniforms.uVignette.value = CFG.vignette;
        postUniforms.uGrain.value = CFG.grain;
        postUniforms.uExposure.value = CFG.exposure;
        postUniforms.uContrast.value = CFG.contrast;
        enterPlayState(false);
    }
}
function advance() {
    ensureAudio();
    if (introPhase === 'typing') { finishTypingNow(); return; }
    if (introPhase === 'waiting') {
        dialogEl.classList.remove('show');
        dlgHint.classList.remove('show');
        runStep();
    }
}

function bindControls() {
    const btnW = document.getElementById('btn-w');
    const btnS = document.getElementById('btn-s');
    const btnLook = document.getElementById('btn-look');

    window.addEventListener('pointerdown', function () {
        ensureAudio();
        if (gameState === 'intro') advance();
        if (gameState === 'ending') Ending.advance();
    }, { passive: true });

    window.addEventListener('keydown', function (e) {
        ensureAudio();
        if (gameState === 'ending') {
            if (e.key === 'f' || e.key === 'F') { e.preventDefault(); Ending.advance(); }
            return;
        }
        if (gameState === 'intro') {
            if (e.key === 'f' || e.key === 'F') { e.preventDefault(); advance(); }
            return;
        }
        if (gameState !== 'playing') return;
        if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') isMovingForward = true;
        if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') isMovingBackward = true;
        if (e.key === 'q' || e.key === 'Q') startLookBack();
        if (e.key === 'Shift') isRunInput = true;
        if (e.key === 'f' || e.key === 'F') { e.preventDefault(); triggerFire(); }
        if (e.key === 'r' || e.key === 'R') triggerDrink();
        if (e.key === 'Escape') pauseGame();
    });
    window.addEventListener('keyup', function (e) {
        if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') isMovingForward = false;
        if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') isMovingBackward = false;
        if (e.key === 'Shift') isRunInput = false;
    });

    let wRect = null;
    btnW.addEventListener('pointerdown', e => {
        e.preventDefault(); btnW.classList.add('pressed');
        wRect = btnW.getBoundingClientRect();
        isRunInput = e.clientY < wRect.top + wRect.height / 2;
        isMovingForward = true;
        try { btnW.setPointerCapture(e.pointerId); } catch (err) {}
    });
    btnW.addEventListener('pointermove', e => {
        if (!isMovingForward || !wRect) return;
        isRunInput = e.clientY < wRect.top + wRect.height / 2;
    });
    function releaseW(e) {
        if (e) e.preventDefault();
        btnW.classList.remove('pressed');
        isMovingForward = false; isRunInput = false;
        if (e && e.pointerId) { try { btnW.releasePointerCapture(e.pointerId); } catch (err) {} }
    }
    btnW.addEventListener('pointerup', releaseW);
    btnW.addEventListener('pointercancel', releaseW);

    btnS.addEventListener('pointerdown', e => { e.preventDefault(); btnS.classList.add('pressed'); isMovingBackward = true; });
    function releaseS(e) { if (e) e.preventDefault(); btnS.classList.remove('pressed'); isMovingBackward = false; }
    btnS.addEventListener('pointerup', releaseS);
    btnS.addEventListener('pointercancel', releaseS);
    btnS.addEventListener('pointerleave', releaseS);

    btnLook.addEventListener('click', e => {
        e.preventDefault();
        if (startLookBack()) return;
        btnLook.classList.add('deny');
        setTimeout(() => btnLook.classList.remove('deny'), 220);
    });

    btnFireEl.addEventListener('pointerdown', e => {
        e.preventDefault();
        triggerFire();
    });
}

function collectParams() {

        lines.push('【' + group.title.replace(/[^\u4e00-\u9fa5A-Za-z]/g, '').trim() + '】');
        group.items.forEach(item => lines.push(item.label + ': ' + fmtVal(item, CFG[item.key])));
    });
    return lines.join('\n');

function copyText(text) {
    const done = () => toast('已复制到剪贴板');
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else fallbackCopy(text, done);
}
function fallbackCopy(text, cb) {
    const ta = document.createElement('textarea'); ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.top = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta); cb();
}
function toast(msg) {
    const btn = document.getElementById('btn-copy');
    if (!btn || btn.dataset.busy) return;
    btn.dataset.busy = '1'; const old = btn.textContent;
    btn.textContent = '✅ ' + msg;
    setTimeout(() => { btn.textContent = old; delete btn.dataset.busy; }, 1200);
}

    /* ---------- 走廊初始化 ---------- */
    function cInitMaterials() {

            t.encoding = THREE.sRGBEncoding; t.anisotropy = maxAniso;
            mat.map = t; mat.bumpMap = t; mat.needsUpdate = true;
        }
        cloneTexTo(cWallMat); cloneTexTo(cFloorMat); cloneTexTo(cCeilMat);
        const til = CFG.wallTiling;
        cWallMat.map.repeat.set(CFG.chunkLength / 2 * til, CFG.ceilingHeight / 2 * til);

    function createWallHuggerTexture() {
        const size = 512;

        cv.width = cv.height = size;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#2a0505'; ctx.shadowColor = '#aa1111'; ctx.shadowBlur = 15;
        ctx.beginPath(); ctx.ellipse(256, 100, 30, 45, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(245, 140); ctx.lineTo(267, 140); ctx.lineTo(275, 350); ctx.lineTo(237, 350); ctx.fill();
        ctx.beginPath(); ctx.moveTo(245, 150); ctx.lineTo(150, 100); ctx.lineTo(10, 180); ctx.lineTo(10, 210); ctx.lineTo(140, 130); ctx.lineTo(240, 180); ctx.fill();
        ctx.beginPath(); ctx.moveTo(240, 180); ctx.lineTo(10, 300); ctx.lineTo(10, 330); ctx.lineTo(230, 210); ctx.fill();
        ctx.beginPath(); ctx.moveTo(267, 150); ctx.lineTo(362, 100); ctx.lineTo(502, 180); ctx.lineTo(502, 210); ctx.lineTo(372, 130); ctx.lineTo(272, 180); ctx.fill();
        ctx.beginPath(); ctx.moveTo(272, 180); ctx.lineTo(502, 300); ctx.lineTo(502, 330); ctx.lineTo(282, 210); ctx.fill();
        const grad = ctx.createLinearGradient(0, 350, 0, 512);
        grad.addColorStop(0, 'rgba(42,5,5,1)'); grad.addColorStop(1, 'rgba(42,5,5,0)');
        ctx.fillStyle = grad; ctx.fillRect(150, 350, 212, 162);
        const img = ctx.getImageData(0, 0, size, size);
        const d = img.data;
        for (let i = 0; i < d.length; i += 4) {
            if (d[i + 3] > 0) {
                const noise = (Math.random() - 0.5) * 20;
                d[i] = Math.max(0, Math.min(255, d[i] + noise));
                d[i+1] = Math.max(0, Math.min(255, d[i+1] + noise));
                d[i+2] = Math.max(0, Math.min(255, d[i+2] + noise));
            }
        }
        ctx.putImageData(img, 0, 0);
        const tex = new THREE.CanvasTexture(cv);
        tex.minFilter = THREE.LinearFilter;
        return tex;
    }

    function createExplosionParticles() {
        const count = 240;
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(count * 3);
        const vels = [];
        const colors = new Float32Array(count * 3);
        const center = EXPLOSION_CENTER;
        for (let i = 0; i < count; i++) {
            pos[i * 3] = center.x; pos[i * 3 + 1] = center.y; pos[i * 3 + 2] = center.z;
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 6;
            const up = (Math.random() - 0.2) * 5;
            vels.push(new THREE.Vector3(Math.cos(angle) * speed, up, Math.sin(angle) * speed));
            colors[i * 3] = 0.6 + Math.random() * 0.4;
            colors[i * 3 + 1] = 0.05 + Math.random() * 0.15;
            colors[i * 3 + 2] = 0.0;
        }
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        const mat = new THREE.PointsMaterial({
            size: 0.18, vertexColors: true, transparent: true, opacity: 1.0,
            blending: THREE.AdditiveBlending, depthWrite: false
        });
        explosionParticles = new THREE.Points(geo, mat);
        explosionParticles.userData = { vels: vels, life: 0 };
        mapRoot.add(explosionParticles);
    }

    /* ---------- 结局对话（复用主游戏的 DOM） ---------- */
    function startCDialogue(en, cn) {
        dialogueState = 'typing';
        currentLine = { en, cn };
        typeIndex = 0; typeTimer = 0;
        dialogEl.classList.add('show');
        dlgEn.textContent = ''; dlgCn.textContent = '';
        dlgCn.classList.remove('show'); dlgHint.classList.remove('show');
        dlgEn.innerHTML = '<span class="cursor"></span>';
    }
    function updateCDialogue(dt) {
        if (dialogueState !== 'typing') return;
        typeTimer += dt;
        while (typeTimer >= charDelay && typeIndex < currentLine.en.length) {
            typeTimer -= charDelay; typeIndex++; playKeySound();
        }
        if (typeIndex >= currentLine.en.length) {
            dlgEn.textContent = currentLine.en;
            dlgCn.textContent = currentLine.cn;
            dlgCn.classList.add('show');
            dialogueState = 'waiting';
            setTimeout(() => { if (dialogueState === 'waiting') dlgHint.classList.add('show'); }, 400);
        } else {
            dlgEn.innerHTML = currentLine.en.substring(0, typeIndex) + '<span class="cursor"></span>';
        }
    }
    function advanceCDialogue() {
        if (dialogueState === 'typing') {
            typeIndex = currentLine.en.length;
            dlgEn.textContent = currentLine.en; dlgCn.textContent = currentLine.cn;
            dlgCn.classList.add('show'); dialogueState = 'waiting'; dlgHint.classList.add('show');
        } else if (dialogueState === 'waiting') {
            dialogEl.classList.remove('show'); dialogueState = 'none';
            cOnDialogueComplete();
        }
    }
    function cOnDialogueComplete() {
        if (cState === 'wait1') {
            cSetState('peek');
            cBreathIntensity = 0.6;
            cStartCamAnim({ x: -0.3, z: 17.2, pitch: -25 * DEG }, 1.5, () => {
                setTimeout(() => {
                    if (cState !== 'peek') return;
                    cSetState('peek_back');
                    cStartCamAnim({ x: 0.00, z: 16.5, pitch: -1.4 * DEG }, 1.5, () => {
                        cBreathIntensity = 1.0;
                        cSetState('wait2');
                        startCDialogue("What is this thing?", "（这是什么东西？）");
                    });
                }, 800);
            });
        } else if (cState === 'wait2') {
            cSetState('walk');
            cBreathIntensity = 0.85;
            cStartCamAnim({ x: -0.3, z: 17.6, pitch: -35 * DEG }, 2.5, () => {
                cSetState('wait3');
                startCDialogue("Maybe I can try pressing it", "（或许我可以尝试按动一下）");
            });
        } else if (cState === 'wait3') {
            cSetState('take');
            terminalGroup.visible = false;
            handTerminalGroup.visible = true;
            playFootstep();
            setTimeout(() => { cSetState('fadeOut'); }, 3000);
        }
    }

    function cSetState(s) { cState = s; cStateTime = 0; }
    function cUpdateStateMachine(dt) {
        switch (cState) {
            case 'explode':
                if (cStateTime > 0.05 && !explosionStarted) {
                    explosionStarted = true;
                    monsterSprite.visible = true;
                    monsterSprite.material.opacity = 1.0;
                    createExplosionParticles();
                    playExplosionSound();
                    cCamShake = 0.35;
                }
                if (cStateTime > 0.35 && monsterSprite.material.opacity > 0) {
                    monsterSprite.material.opacity = Math.max(0, 1 - (cStateTime - 0.35) / 0.9);
                }
                if (cStateTime > 1.2 && !terminalGroup.visible) {
                    terminalGroup.visible = true;
                    terminalGroup.scale.set(0, 0, 0);
                }
                if (cStateTime > 2.6) {
                    cBreathIntensity = 1.4;
                    cSetState('wait1');
                    startCDialogue("He seems to have exploded, let me take a break", "（他貌似爆炸了，让我缓一缓）");
                }
                break;
            case 'fadeOut':
                postUniforms.uFade.value = Math.max(0, 1 - cStateTime / 2.2);
                if (cStateTime >= 2.2) {
                    cSetState('done');
                    switchToRoom();
                }
                break;
        }
    }
    function cStartCamAnim(to, duration, onComplete) {
        cCamAnim = {
            from: { x: camBase.x, y: camBase.y, z: camBase.z, yaw: camBase.yaw, pitch: camBase.pitch },
            to: to, duration: duration, t: 0, onComplete: onComplete
        };
    }
    function cUpdateCamAnim(dt) {
        if (!cCamAnim) return;
        cCamAnim.t += dt;
        const u = Math.min(1, cCamAnim.t / cCamAnim.duration);
        const e = easeInOut(u);
        camBase.x = lerp(cCamAnim.from.x, cCamAnim.to.x !== undefined ? cCamAnim.to.x : cCamAnim.from.x, e);
        camBase.y = lerp(cCamAnim.from.y, cCamAnim.to.y !== undefined ? cCamAnim.to.y : cCamAnim.from.y, e);
        camBase.z = lerp(cCamAnim.from.z, cCamAnim.to.z !== undefined ? cCamAnim.to.z : cCamAnim.from.z, e);
        camBase.yaw = lerp(cCamAnim.from.yaw, cCamAnim.to.yaw !== undefined ? cCamAnim.to.yaw : cCamAnim.from.yaw, e);
        camBase.pitch = lerp(cCamAnim.from.pitch, cCamAnim.to.pitch !== undefined ? cCamAnim.to.pitch : cCamAnim.from.pitch, e);
        if (u >= 1) {
            const cb = cCamAnim.onComplete;
            cCamAnim = null;
            if (cb) cb();
        }
    }
    function cUpdateMonster() {
        if (monsterSprite && monsterSprite.visible) {
            monsterSprite.position.y = EXPLOSION_CENTER.y + Math.sin(cClockTime * 1.5) * 0.03;
        }
    }
    function cUpdateTerminal(dt) {
        if (terminalGroup && terminalGroup.visible) {
            const s = terminalGroup.scale.x;
            if (s < 0.12) terminalGroup.scale.setScalar(Math.min(0.12, s + dt * 0.4));
        }
    }
    function cUpdateExplosion(dt) {
        if (!explosionParticles) return;
        const posAttr = explosionParticles.geometry.attributes.position;
        const vels = explosionParticles.userData.vels;
        for (let i = 0; i < vels.length; i++) {
            vels[i].y -= 9.8 * dt;
            posAttr.array[i * 3]     += vels[i].x * dt;
            posAttr.array[i * 3 + 1] += vels[i].y * dt;
            posAttr.array[i * 3 + 2] += vels[i].z * dt;
        }
        posAttr.needsUpdate = true;
        explosionParticles.userData.life += dt;
        explosionParticles.material.opacity = Math.max(0, 1 - explosionParticles.userData.life / 2.2);
        if (explosionParticles.userData.life > 2.5) {
            mapRoot.remove(explosionParticles);
            explosionParticles = null;
        }
    }
    function cUpdateAudio(dt) {
        if (cState === 'explode' || cState === 'wait1' || cState === 'peek' || cState === 'peek_back' || cState === 'wait2' || cState === 'wait3') {
            breathTimer -= dt;
            if (breathTimer <= 0) { playBreath(); breathTimer = 2.0 + Math.random() * 1.5; }
        }
        if (cState === 'walk') {
            footTimer -= dt;
            if (footTimer <= 0) { playFootstep(); footTimer = 0.45 + Math.random() * 0.15; }
        }
    }
    function cApplyCamera(dt) {
        const breatheX = Math.sin(cClockTime * 11) * 0.008 * cBreathIntensity;
        const breatheY = Math.cos(cClockTime * 8)  * 0.012 * cBreathIntensity;
        let shakeX = 0, shakeY = 0;
        if (cCamShake > 0.001) {
            shakeX = (Math.random() - 0.5) * cCamShake;
            shakeY = (Math.random() - 0.5) * cCamShake;
            cCamShake *= Math.pow(0.02, dt);
        }
        cCamera.position.set(camBase.x + breatheX + shakeX, camBase.y + breatheY + shakeY, camBase.z);
        cCamera.rotation.set(camBase.pitch + breatheY * 0.4, camBase.yaw + breatheX * 0.4, breatheX * 0.15);
    }
    function cUpdate(dt) {
        cClockTime += dt;
        cStateTime += dt;
        cUpdateStateMachine(dt);
        cUpdateCamAnim(dt);
        cUpdateMonster();
        cUpdateTerminal(dt);
        cUpdateExplosion(dt);
        cUpdateAudio(dt);
        updateCDialogue(dt);
        cApplyCamera(dt);
    }
