        torso.position.y = 1.20; person.add(torso);
        const armL = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.62, 0.14), clothMat);
        armL.position.set(-0.30, 1.22, 0); person.add(armL);
        const armR = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.62, 0.14), clothMat);
        armR.position.set(0.30, 1.22, 0); person.add(armR);
        const legL = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.80, 0.18), clothMat);
        legL.position.set(-0.14, 0.40, 0); person.add(legL);
        const legR = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.80, 0.18), clothMat);
        legR.position.set(0.14, 0.40, 0); person.add(legR);
        person.position.set(-0.85, 0, 2.0);
        person.rotation.y = Math.PI;
        person.visible = false;
        rScene.add(person);

        fogGroup = new THREE.Group();
        for (let i = 0; i < 42; i++) {
            const m = new THREE.Mesh(
                new THREE.SphereGeometry(0.18 + Math.random() * 0.5, 8, 8),
                new THREE.MeshStandardMaterial({ color: 0x000000, transparent: true, opacity: 0.0, roughness: 1.0 })
            );
            m.position.set(
                (Math.random() - 0.5) * 2.6,
                Math.random() * 2.3,
                frontWallZ - 0.5 + (Math.random() - 0.5) * 1.4
            );
            m.userData.spd = 0.05 + Math.random() * 0.14;
            fogGroup.add(m);
        }
        rScene.add(fogGroup);

        rCamera.position.copy(POS_START);
        rCamera.quaternion.copy(quatLookAt(rCamera.position, LOOK_SCREEN));
    }

    function quatLookAt(pos, target) {
        _m4.lookAt(pos, target, _up);
        return new THREE.Quaternion().setFromRotationMatrix(_m4);
    }
    function shakeVec(t, amp) {
        return new THREE.Vector3(
            (Math.sin(t * 1.70) * 0.60 + Math.sin(t * 3.10 + 1.3) * 0.40) * amp,
            (Math.sin(t * 2.30 + 1.1) * 0.60 + Math.sin(t * 4.70) * 0.40) * amp,
            (Math.sin(t * 1.30 + 2.2) * 0.60 + Math.sin(t * 3.70) * 0.40) * amp
        );
    }
    function getCamPos(T) {
        if (T <= T_MOVE_START) return POS_START.clone();
        const k = sstep(T_MOVE_START, T_MOVE_END, T);
        const p = POS_START.clone().lerp(POS_DESK, k);
        p.y += Math.sin(k * Math.PI) * 0.16;
        p.x += Math.sin(k * Math.PI) * 0.10;
        return p;
    }
    function getLookAt(T) {
        if (T <= T_LOOK_START) return LOOK_SCREEN.clone();
        if (T <= T_LOOK_END) {
            const k = sstep(T_LOOK_START, T_LOOK_END, T);
            return LOOK_SCREEN.clone().lerp(LOOK_DOOR, k);
        }
        if (T <= T_MOVE_START) return LOOK_DOOR.clone();
        const k = sstep(T_MOVE_START, T_MOVE_END, T);
        return LOOK_DOOR.clone().lerp(LOOK_DESK, k);
    }
    function getShakeAmp(T) {
        if (T < T_LOOK_START) return lerp(0.055, 0.014, sstep(0, T_WAKE_END, T));
        if (T < T_MOVE_START) return 0.017;
        if (T < T_WALK_START) return 0.013;
        if (T < T_FOG_START)  return 0.006;
        return 0.011;
    }
    function getBlink(T) {
        if (T < 0.55) return 1.0;
        if (T < 0.95) return lerp(1.0, 0.18, sstep(0.55, 0.95, T));
        if (T < 1.45) return 0.18;
        if (T < 2.05) return lerp(0.18, 0.72, sstep(1.45, 2.05, T));
        if (T < 2.90) return lerp(0.72, 0.00, sstep(2.05, 2.90, T));
        const cyc = (T - 3.4) % 3.6;
        if (T > 3.4 && cyc < 0.16) return Math.sin(cyc / 0.16 * Math.PI);
        return 0.0;
    }

    function rStart() {
        rT = 0;
        roomRunning = true;
        knockTimer = 0;
        doorSoundPlayed = false;
        startRoomAmbient();
    }

    function rUpdate(dt) {
        if (!roomRunning) return;
        rT += dt;
        const basePos = getCamPos(rT);
        const look = getLookAt(rT);
        const amp = getShakeAmp(rT);
        rCamera.position.copy(basePos).add(shakeVec(rT, amp));
        const baseQ = quatLookAt(rCamera.position, look);
        const rollK = sstep(T_MOVE_START + 1.0, T_MOVE_END, rT);
        _qRoll.setFromAxisAngle(_zAxis, -0.10 * rollK);
        baseQ.multiply(_qRoll);
        rCamera.quaternion.slerp(baseQ, 1 - Math.pow(0.001, dt));

        if (rT < T_MOVE_END - 0.5) {
            postUniforms.uBlink.value = getBlink(rT);
        } else {
            postUniforms.uBlink.value = 0.0;
        }
        postUniforms.uBlur.value = 3.0 * (1 - sstep(0.0, 4.5, rT)) + 0.45 + 0.35;

        if (rT > T_LOOK_START && rT < T_WALK_START) {
            knockTimer -= dt;
            if (knockTimer <= 0) {
                const prog = sstep(T_LOOK_START, T_LOOK_START + 3.5, rT);
                playKnock(0.35 + prog * 0.75);
                knockTimer = 1.55 - prog * 0.55;
            }
        }
        if (rT > T_MOVE_START - 1.0) person.visible = true;
        const walkK = sstep(T_WALK_START, T_WALK_END, rT);
        person.position.z = lerp(2.0, 5.55, walkK);
        person.position.x = lerp(-0.85, 0.0, walkK);
        const turnK = sstep(T_WALK_START, T_WALK_START + 1.1, rT);
        person.rotation.y = lerp(Math.PI, 0, turnK);
        if (walkK > 0.02 && walkK < 0.995) {
            person.position.y = Math.abs(Math.sin(rT * 7.5)) * 0.035;
        } else {
            person.position.y = lerp(person.position.y, 0, 0.15);
        }

        if (rT > T_DOOR_START) {
            if (!doorSoundPlayed) { playDoorCreak(); doorSoundPlayed = true; }
            const dk = sstep(T_DOOR_START, T_DOOR_END, rT);
            doorGroup.rotation.y = lerp(0.055, 0.62, dk);
        }
        if (rT > T_FOG_START) {
            const fk = sstep(T_FOG_START, T_FOG_END, rT);
            fogGroup.children.forEach(child => {
                const target = 0.85 * fk;
                child.material.opacity += (target - child.material.opacity) * Math.min(1, dt * 1.5);
                child.position.y += dt * child.userData.spd * 0.5;
            });
        }
        if (rT > T_FOG_START) {
            const dk = sstep(T_FOG_START, T_BLACK_START, rT);
            const f = 1 - dk;
            roomAmbient.intensity = 0.34 * f;
            hemiLight.intensity = 0.55 * f;
            lampA.light.intensity = 0.85 * f;
            lampB.light.intensity = 0.85 * f;
            screenGlow.intensity = 0.45 * f;
            screenObj.material.emissiveIntensity = 0.55 * f;
        }
        if (rT > T_BLACK_START) {
            const bk = sstep(T_BLACK_START, T_BLACK_END, rT);
            postUniforms.uFade.value = 1 - bk;
            postUniforms.uExposure.value = 1.10 + Math.sin(bk * Math.PI) * 0.55;
        }
        if (rT >= T_BLACK_END) {
            /* 结束 → 显示返回提示 */
            roomRunning = false;
            phase = 'finished';
            document.getElementById('ending-hint').classList.add('show');
        }
    }

    /* ---------- 切换 / 对外 ---------- */
    function switchToRoom() {
        phase = 'room';
        dialogEl.classList.remove('show');
        dlgHint.classList.remove('show');
        postUniforms.uFade.value = 1.0;   
        rStart();
    }

    function begin() {
        phase = 'corridor';
        corridorDone = false;
        cState = 'explode';
        cStateTime = 0;
        explosionStarted = false;
        cClockTime = 0;
        cCamShake = 0;
        cBreathIntensity = 1.0;
        camBase.x = 0.00; camBase.y = 0.90; camBase.z = 16.50;
        camBase.yaw = 163.3 * DEG; camBase.pitch = -1.4 * DEG;
        breathTimer = 0; footTimer = 0;
        dialogueState = 'none';
        cCamera.position.set(camBase.x, camBase.y, camBase.z);
        cCamera.rotation.set(camBase.pitch, camBase.yaw, 0);
    }

    function update(dt) {
        if (phase === 'corridor') cUpdate(dt);
        else if (phase === 'room') rUpdate(dt);
    }

    function advance() {
        if (phase === 'finished') {
            returnToMenu();
            return;
        }
        if (phase !== 'corridor') return;
        if (dialogueState !== 'none') advanceCDialogue();
    }

    function onResize() {
        cCamera.aspect = innerWidth / innerHeight;
        cCamera.updateProjectionMatrix();
        rCamera.aspect = innerWidth / innerHeight;
        rCamera.updateProjectionMatrix();
    }

    function getScene() { return phase === 'room' ? rScene : cScene; }
    function getCamera() { return phase === 'room' ? rCamera : cCamera; }

    return { init: function () { cInit(); rInit(); }, begin, update, advance, onResize, getScene, getCamera };
})();

/* ================================================================
   三十、主循环
   ================================================================ */
function updateMenu(dt) {
    currentZ -= 0.5 * dt;
    camera.position.set(
        Math.sin(clockTime * 0.4) * 0.01,
        CFG.eyeHeight + Math.sin(clockTime * 0.8) * 0.015,
        currentZ
    );
    camera.rotation.set(
        Math.sin(clockTime * 0.3) * 0.015,
        Math.sin(clockTime * 0.2) * 0.03,
        Math.sin(clockTime * 0.5) * 0.01
    );
    updateChunks();
}

function updateIntro(dt) {
    if (introPhase === 'typing') updateTyping(dt);
    if (camAnim) { if (updateCameraAnim(dt)) runStep(); }
    if (actionState) { if (updateAction(dt)) runStep(); }
    if (!inCorridor && !camAnim && !actionState) {
        camera.position.y = 1.6 + Math.sin(clockTime * 0.8) * 0.012;
    }
    if (inCorridor) updateChunks();
}

function updatePlaying(dt) {
    gamePlayTime += dt;

    let moving = false;
    if (stamina <= 0) isExhausted = true;
    if (isExhausted && stamina >= CFG.staminaMax * 0.3) isExhausted = false;

    const wantToRun = isMovingForward && isRunInput;
    const canRun = wantToRun && !isExhausted && stamina > 0;

    if (canRun) {
        stamina -= CFG.staminaCost * dt;
        if (stamina < 0) stamina = 0;
    } else {
        const rate = (isMovingForward || isMovingBackward) ? CFG.staminaRecoverWalk : CFG.staminaRecoverIdle;
        stamina += rate * dt;
        if (stamina > CFG.staminaMax) stamina = CFG.staminaMax;
    }
    updateStaminaUI();
    savedStamina = stamina;

    let speedMul = getLookSpeedMul();
    if (canRun) speedMul *= CFG.runSpeedMul;
    if (isMovingForward)  { currentZ -= CFG.speed * speedMul * dt; moving = true; }
    if (isMovingBackward) { currentZ += CFG.speed * speedMul * dt; moving = true; }

    camera.position.z = currentZ;
    const baseY = CFG.eyeHeight;
    let rollTarget;

    if (moving) {
        walkTime += dt * 9 * (speedMul < 1 ? 0.5 + speedMul * 0.5 : 1);
        const s = CFG.shake;
        camera.position.y = baseY + Math.sin(walkTime) * s;
        camera.position.x = Math.sin(walkTime * 0.5) * s * 0.5;
        rollTarget = Math.cos(walkTime * 0.5) * s * 0.6;
    } else {
        const k = 1 - Math.pow(0.0005, dt);
        camera.position.y += (baseY - camera.position.y) * k;
        camera.position.x += (0 - camera.position.x) * k;
        rollTarget = 0;
    }
    roll += (rollTarget - roll) * (1 - Math.exp(-10 * dt));

    const lk = 1 - Math.exp(-CFG.lookSpeed * dt);
    lookYaw += (targetYaw - lookYaw) * lk;
    lookPitch += (targetPitch - lookPitch) * lk;
    updateLookState(dt);
    camera.rotation.set(lookPitch, lookYaw, roll);

    if (CFG.threatDecay > 0 && gamePlayTime % 5 < dt) {
        threatValue = Math.max(0, threatValue - CFG.threatDecay);
        updateThreatUI(threatValue);
    }

    /* 三个独立计时器 */
    if (gamePlayTime > 5) {
        if (!frontMonster) {
            frontSpawnTimer -= dt;
            if (frontSpawnTimer <= 0) {
                createMonster(true);
                frontSpawnTimer = CFG.monsterSpawnMin + Math.random() * (CFG.monsterSpawnMax - CFG.monsterSpawnMin);
            }
        }
        if (!backMonster) {
            backSpawnTimer -= dt;
            if (backSpawnTimer <= 0) {
                createMonster(false);
                backSpawnTimer = CFG.monsterSpawnMin + Math.random() * (CFG.monsterSpawnMax - CFG.monsterSpawnMin);
            }
        }
        dropTimer -= dt;
if (dropTimer <= 0) {
    dropTimer = CFG.monsterSpawnMin + Math.random() * (CFG.monsterSpawnMax - CFG.monsterSpawnMin);
    if (Math.random() < CFG.bulletChance) spawnDrop('bullet');
}

potionDropTimer -= dt;
if (potionDropTimer <= 0) {
    potionDropTimer = 45;
    spawnDrop('potion');
}
}

    updateMonsters(dt);
    updateDrops(dt);

    let danger = false;
    if (frontMonster && frontMonster.retreatTimer <= 0 && frontMonster.spawnGrace <= 0 && frontMonster.dist <= CFG.warnDist) danger = true;
    if (backMonster && backMonster.retreatTimer <= 0 && backMonster.spawnGrace <= 0 && backMonster.dist <= CFG.warnDist) danger = true;
    triggerWarning(danger);

    updateWeaponAnim(dt);

    if (camShake > 0) {
        camera.position.x += (Math.random() - 0.5) * camShake;
        camera.position.y += (Math.random() - 0.5) * camShake;
        camShake -= dt * 2;
        if (camShake < 0) camShake = 0;
    }

    updateChunks();
}

function renderFrame() {
    let sc = scene, ca = camera;
    if (gameState === 'ending') {
        sc = Ending.getScene();
        ca = Ending.getCamera();
    }
    renderer.setRenderTarget(rt);
    renderer.render(sc, ca);
    renderer.setRenderTarget(null);
    postUniforms.tDiffuse.value = rt.texture;
    postUniforms.uTime.value = clockTime;
    renderer.render(postScene, postCamera);
}

function animate(now) {
    requestAnimationFrame(animate);
    if (!lastTime) lastTime = now;
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.1) dt = 0.1;
    clockTime += dt;

    if (gameState === 'menu') updateMenu(dt);
    else if (gameState === 'intro') updateIntro(dt);
    else if (gameState === 'playing') updatePlaying(dt);
    else if (gameState === 'ending') Ending.update(dt);

    renderFrame();
}

/* ================================================================
   三十一、resize
   ================================================================ */
function onResize() {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    rt.setSize(w, h);
    postUniforms.uResolution.value.set(w, h);
    if (typeof Ending !== 'undefined') Ending.onResize();
}

/* 启动 */
init();

})();
</script>
